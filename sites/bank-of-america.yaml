# Bank of America — bank and credit card statements (bankofamerica.com).
# Format: docs/site-recipes.md. Regexes are written in 'single quotes' so backslashes stay as-is.
id: bank-of-america
name: Bank of America (bank and credit card statements)
kind: statement
region: US
website: https://www.bankofamerica.com
verified: 2026-11-25
notes: >
  Online ID + passcode, then a one-time code on new devices. The site refuses automated
  browsers ("Access Denied"), so SD opens a regular Chrome window. Once BofA remembers this PC,
  scheduled checks open it by themselves and sign in; if BofA asks for a code or blocks the
  window, SD stops and asks you to choose Sign in now (it fills the login; you enter the code). One login shows every account: Statements & Documents lists the current
  year's statements for all of them as cards; filling gaps picks older years in its year list. Set siteOptions.account to the last four digits
  shown on the card ("Business Adv Relationship - 1234") — one SD account per BofA account.
  Card statements print the closing date and New Balance Total; bank statements the period
  end and ending balance; mortgage statements the statement date and total amount due (a
  mortgage's Escrow Analysis, listed alongside, is skipped).

options:
  account: The account's last four digits as Statements & Documents shows them, e.g. "1234".

signIn:
  url: https://www.bankofamerica.com/
  username: '#oid'
  password: '#pass'
  submit: '#secure-signin-submit'
  signedIn: 'a:has-text("Log out")'
  yourBrowser: true
  unattended: true

documents:
  steps:
    - follow: '#nav_accounts_overview_statements_and_documents_id'
    # The Statements panel may open collapsed or remember being open: expand it only if it's closed.
    - waitFor: 'button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"][data-initialized="true"]'
      timeout: 60s
    - click: 'button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"][aria-expanded="false"]'
      timeout: 5s
      optional: true
    # The panel can come back drawn closed while its button still says it's open (the wrapper
    # then says all-panels-closed): click it until it's drawn open (two clicks at most).
    - click: '#stmtsAndDocsSqueezebox.all-panels-closed button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"]'
      timeout: 2s
      optional: true
    - waitFor: '#stmtsAndDocsSqueezebox:not(.all-panels-closed)'
      timeout: 3s
      optional: true
    - click: '#stmtsAndDocsSqueezebox.all-panels-closed button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"]'
      timeout: 2s
      optional: true
  # The list shows one year (the current one by default). Filling gaps picks each missing year in
  # the year drop-down; its id isn't confirmed on the live page, hence the fallbacks.
  years:
    - select: 'select#yearListSelect, #yearListSelect select, #eccFilters select[id*="year" i], #eccFilters select[name*="year" i]'
      option: '{year}'
    - waitFor: 'button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"][data-initialized="true"]'
      timeout: 60s
    - click: 'button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"][aria-expanded="false"]'
      timeout: 5s
      optional: true
    # The panel can come back drawn closed while its button still says it's open (the wrapper
    # then says all-panels-closed): click it until it's drawn open (two clicks at most).
    - click: '#stmtsAndDocsSqueezebox.all-panels-closed button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"]'
      timeout: 2s
      optional: true
    - waitFor: '#stmtsAndDocsSqueezebox:not(.all-panels-closed)'
      timeout: 3s
      optional: true
    - click: '#stmtsAndDocsSqueezebox.all-panels-closed button.panel-header[aria-controls="stmtsAndDocsSqueezeboxPanel0"]'
      timeout: 2s
      optional: true
  list:
    # A mortgage also lists its Escrow Analysis here; only statements are wanted.
    rows: '#stmtsAndDocsSqueezeboxPanel0 .card:has(.accountName[title$="- {account}"]):not([data-docdisplayname*="Escrow" i])'
    date: { selector: '.availableTillDate' }
    expand: '.front'
    link: { selector: 'a.download-pdf-link' }
  download: click

parse:
  require: 'bankofamerica\.com'
  # Bank: "for September 1, 2026 to September 30, 2026". Card: "Statement Closing Date ..... 10/07/26".
  date:
    - 'for [A-Z][a-z]+ \d{1,2}, \d{4} to ([A-Z][a-z]+ \d{1,2}, \d{4})'
    # Business cards print a two-digit year, personal cards four.
    - 'Statement Closing Date \.* ?(\d{2}/\d{2}/\d{2}(?:\d{2})?)'
    # Mortgage: "Statement date 11/02/2026".
    - 'Statement date (\d{2}/\d{2}/\d{4})'
  dateFormats: ['MMMM d, yyyy', 'MMMM dd, yyyy', 'MM/dd/yy', 'MM/dd/yyyy', 'MMM dd, yyyy']
  accountNumber:
    - 'Account number: \d{4} \d{4} (\d{4})'
    - '\d{4} \d{4} \d{4} (\d{4}) [A-Z][a-z]+ \d{2}, \d{4} - '
    - 'Account Number:\s+\d{4} \d{4} \d{4} (\d{4})'
    - 'Acct ending in (\d{4})'
  # Card: the new balance. Bank: the ending balance. Mortgage: the amount due.
  amount:
    - 'New Balance Total \.* ?\$([\d,]+\.\d{2})'
    - 'Total amount due \$([\d,]+\.\d{2})'
    - 'Ending balance on [A-Z][a-z]+ \d{1,2}, \d{4} \$([\d,]+\.\d{2})'

# Checked by the test suite. Made-up numbers only; text is in the order `pdf-text` prints it.
tests:
  documents:
    - text: >-
        Customer service information 1.888.BUSINESS bankofamerica.com Bank of America, N.A. EXAMPLE LLC
        Your Business Advantage Relationship Banking for September 1, 2026 to September 30, 2026
        Account number: 1111 2222 1234 EXAMPLE LLC Account summary Beginning balance on September 1, 2026
        $1,000.00 Deposits and other credits 500.00 Ending balance on September 30, 2026 $1,234.56
      expect: { date: 2026-09-30, amount: 1234.56, accountNumber: '1234' }
    - text: >-
        EXAMPLE LLC 1111 2222 3333 5678 September 08, 2026 - October 07, 2026 Company Statement Account
        Summary Previous Balance ........ $100.00 New Balance Total ....... $123.45 Statement Closing Date
        .......... 10/07/26 Account Information: www.bankofamerica.com
      expect: { date: 2026-10-07, amount: 123.45, accountNumber: '5678' }
    - text: >-
        EXAMPLE NAME Customized Cash Rewards Visa Signature Account# 1111 2222 3333 5678 December 16 -
        January 15, 2027 New Balance Total $2,345.67 Current Payment Due $25.00 Statement Closing Date
        01/15/2027Days in Billing Cycle 31 Account Number:    1111 2222 3333 5678Payment Due Date
        02/12/2027 www.bankofamerica.com
      expect: { date: 2027-01-15, amount: 2345.67, accountNumber: '5678' }
    - text: >-
        Customer service information bankofamerica.com Account Information Property address 1 EXAMPLE WAY
        Principal balance $100,000.00 Account number 1234567890 Statement date 11/02/2027 Payment due date
        12/01/2027 Total amount due $1,234.56 Explanation of total amount due Total amount due $1,234.56
        Home Loan Account EXAMPLE NAME Acct ending in 7890 11/02/2027 Page 2 of 6
      expect: { date: 2027-11-02, amount: 1234.56, accountNumber: '7890' }
    - text: 'JPMorgan Chase chase.com through October 30, 2026 Ending Balance $5.00'
      expect: null
  rows:
    - cells: ['Nov 07, 2026']
      expect: { date: 2026-11-07, url: '' }
