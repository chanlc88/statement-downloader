# DeKalb County, Georgia — water & sewer bills (myaccount.dekalbcountyga.gov).
# Format: docs/site-recipes.md. Regexes are written in 'single quotes' so backslashes stay as-is.
id: dekalb-water
name: DeKalb County Water & Sewer (GA)
kind: bill
region: US-GA
website: https://myaccount.dekalbcountyga.gov
verified: 2026-11-20
notes: >
  Plain "access code" + password sign-in, no CAPTCHA or verification code. Session cookies
  only, so every run signs in again (nothing to "remember"). About two years of bills are
  listed, newest first.

signIn:
  url: https://myaccount.dekalbcountyga.gov/app/
  username: '#accessCode'
  password: '#password'
  submit: '#login_btn'
  signedIn: "#logoff, a:has-text('Logout'), a:has-text('Log Out')"

documents:
  steps:
    - click: "a[href='#tabs-BILLINQ']"     # Bills & Payment tab
  list:
    # My Bills: [View Bill button, bill date "Nov 18, 2026", amount "$73.21", due date]
    frame: '#iframe-BILLINQ'
    rows: '#billTable tbody tr'
    wait: 45s
    date: { column: 2 }
    amount: { column: 3 }
    link:
      # onclick="MM_openBrWindow('/app/eBillViewerServlet?key=…', …)" — the URL returns the PDF.
      selector: "a[onclick*='eBillViewerServlet']"
      attribute: onclick
      pattern: "MM_openBrWindow\\('([^']+)'"
  download: fetch

parse:
  require: 'Water\s*&\s*Sewer'
  date: 'Bill Date:?\s*(\d{1,2}/\d{1,2}/\d{2,4})'
  # The header reads "Account Number Statement Number <account> <statement>"; older bills pair
  # each label with its number.
  statementNumber:
    - 'Account Number\s+Statement Number\s+\d{6,}\s+(\d{5,})'
    - 'Statement Number\s*(\d{5,})'
  accountNumber:
    - 'Account Number\s+Statement Number\s+(\d{6,})'
    - 'Account Number\s*(\d{6,})'
  # Current Charges is what this bill costs; Total Amount Due can include a balance forward.
  amount: 'Current Charges\s*\$\s*([\d,]+\.\d{2})'

# Checked by the test suite. Made-up numbers only; text is in the order `pdf-text` prints it.
tests:
  documents:
    - text: >-
        Usage = Gals x 100 Page 1 of 2 Account Number Statement Number 1234567890 98765432 Water & Sewer Bill for JANE DOE
        Service Address: 100 MAIN ST Bill Date: 11/18/26 Bill Summary Balance Forward Current Charges Total Amount Due
        $6.79 $73.21 $80.00 Due 12/09/26 Historical Usage Billing Details Previous Balance $106.50 Payment(s) Applied -$99.71
        Balance Forward $6.79 Current Charges $73.21 Adjustments $0.00 Total Due On or Before 12/09/26 $80.00
        Account Number 1234567890 Statement Number 98765432
      expect: { date: 2026-11-18, statementNumber: '98765432', amount: 73.21, accountNumber: '1234567890' }
    - text: >-
        Account Number 1234567890 Page 1 of 2 Statement Number 98765432 Water & Sewer Bill for JANE DOE
        Bill Date: 11/18/26 Current Charges $73.21 Total Amount Due $80.00
      expect: { date: 2026-11-18, statementNumber: '98765432', amount: 73.21, accountNumber: '1234567890' }
    - text: 'Georgia Power statement Bill Date: 11/18/26'
      expect: null
  rows:
    - cells: ['View Bill', 'Nov 18, 2026', '$73.21', 'Dec 09, 2026']
      link: "MM_openBrWindow('/app/eBillViewerServlet?key=abc123','bill','width=800')"
      expect: { date: 2026-11-18, amount: 73.21, url: '/app/eBillViewerServlet?key=abc123' }
