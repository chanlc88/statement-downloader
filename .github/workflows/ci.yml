name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Check the dashboard script parses
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -c "import re; s=open('src/StatementDownloader.App/ui/index.html').read(); open('/tmp/ui.js','w').write(re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)[-1])"
          node --check /tmp/ui.js
