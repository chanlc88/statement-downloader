<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement Downloader</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
    --accent: #2f5bd3; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0362c; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e7eaf0; --muted: #9aa3b2; --line: #2c323c;
            --accent: #7c9cff; --ok: #4cc283; --warn: #f0b04a; --bad: #ff7a6e; --chip: #262b34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 17px; margin: 0; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 18px; font-weight: 500; }
  nav a.active { color: var(--text); }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 12px; text-align: center; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card h2 a { color: inherit; text-decoration: none; }
  .signin-mode { margin: -16px -18px 12px; padding: 6px 18px; border-radius: 10px 10px 0 0; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .signin-mode.own { background: color-mix(in srgb, var(--ok) 16%, var(--panel)); color: var(--ok); }
  .signin-mode.remembered { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); color: var(--accent); }
  .signin-mode.every-time { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); color: var(--warn); }
  .signin-mode span { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row span:first-child { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--chip); }
  .s-healthy { color: var(--ok); } .s-expiring-soon { color: var(--warn); } .s-needs-assist, .s-broken { color: var(--bad); } .s-assisting { color: var(--accent); }
  .issue { border-left: 4px solid var(--bad); background: var(--chip); padding: 8px 12px; border-radius: 6px; margin: 10px 0 0; }
  .issue.heads-up { border-color: var(--warn); } .issue.info { border-color: var(--accent); }
  .issue b { display: block; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  h3 { margin: 28px 0 10px; font-size: 15px; }
  .callout { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; }
  code { font-size: 13px; }
  label { display: block; font-weight: 600; font-size: 13.5px; margin: 12px 0 4px; }
  input[type=text] { width: 100%; font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .preview { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--chip); border-radius: 7px; padding: 7px 10px; margin-top: 10px; word-break: break-all; }
  .preview.bad { color: var(--bad); font-family: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .group-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; cursor: pointer; user-select: none; }
  .group-head:first-child { margin-top: 4px; }
  .group-head h2 { font-size: 15px; margin: 0; }
  .group-head .caret { display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
  .group-head.collapsed .caret { transform: rotate(-90deg); }
  .list .lhead { padding: 7px 14px; background: var(--chip); font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; border-top: 1px solid var(--line); }
  .list .lhead:first-child { border-top: 0; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; }
  .toolbar input[type=search] { flex: 1; max-width: 420px; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .lrow:first-child { border-top: 0; }
  .lrow .lmain { flex: 1; min-width: 0; }
  .lrow .path { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow.editing { display: block; background: var(--chip); }
  .lrow.editing .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .lrow.saved { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--ok) 22%, transparent); } to { background: transparent; } }
  .rowbtns { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .rowbtns button { white-space: nowrap; }
  @media (max-width: 700px) { .lrow.editing .fields { grid-template-columns: 1fr; } }

  /* Accounts overview: a summary, then one compact row per account. */
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; color: inherit; text-decoration: none; }
  a.tile:hover { border-color: var(--accent); }
  .tile .n { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .tile.bad .n { color: var(--bad); } .tile.warn .n { color: var(--warn); } .tile.ok .n { color: var(--ok); }
  .tile .l { font-size: 13px; color: var(--muted); }
  .tile .who { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.3fr) minmax(0, 1.6fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .arow:first-child { border-top: 0; }
  .arow .c-name a { font-weight: 600; color: inherit; text-decoration: none; }
  .arow .c-name a:hover { text-decoration: underline; }
  .arow .c-status.warn { color: var(--warn); } .arow .c-status.bad { color: var(--bad); } .arow .c-status.busy { color: var(--accent); }
  .arow .c-act { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  .sub { font-size: 12.5px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--ok); vertical-align: 1px; }
  .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.busy { background: var(--accent); }
  .new { font-size: 11.5px; font-weight: 700; color: var(--ok); margin-left: 4px; }
  .mode { font-size: 11.5px; padding: 0 7px; border-radius: 999px; margin-left: 6px; background: var(--chip); color: var(--muted); }
  .mode.every-time { color: var(--warn); } .mode.remembered { color: var(--accent); }
  .linkbtn { background: none; border: 0; padding: 0 2px; color: var(--accent); cursor: pointer; font-size: 13px; }
  a.button { display: inline-block; font: inherit; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-decoration: none; }
  a.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  details.more { position: relative; }
  details.more summary { list-style: none; cursor: pointer; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); line-height: 1.3; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 3; min-width: 210px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
  details.more .menu button, details.more .menu a { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px; }
  details.more .menu button:hover, details.more .menu a:hover { background: var(--chip); }
  details.more .menu .sub { display: block; }
  .attention { margin-bottom: 8px; }
  /* Issues and activity */
  .issue .what { margin-top: 2px; }
  .issue .when { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  details.tech { margin-top: 6px; font-size: 12.5px; }
  details.tech summary { cursor: pointer; color: var(--muted); }
  details.tech pre { white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0 0; font-size: 12px; }
  .act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 9px 14px; border-top: 1px solid var(--line); }
  .act:first-child { border-top: 0; }
  .act .dot { margin: 6px 0 0; }
  .act .meta { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  @media (max-width: 720px) { .act { grid-template-columns: auto minmax(0, 1fr); } .act .meta { grid-column: 2; text-align: left; white-space: normal; } }
  /* Account page */
  .acct-head h2 { font-size: 19px; margin: 0 0 4px; }
  .acct-head .state { font-weight: 600; }
  .acct-head .state.warn { color: var(--warn); } .acct-head .state.bad { color: var(--bad); } .acct-head .state.busy { color: var(--accent); }
  .acct-head p { margin: 8px 0 0; }
  details.year { margin-bottom: 10px; }
  details.year > summary { cursor: pointer; font-weight: 600; padding: 4px 0 8px; }
  details.year > summary .muted { font-weight: 400; }
  .attention .lhead { color: var(--bad); }
  @media (max-width: 720px) {
    .arow { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
    .arow .c-act { grid-column: 2; grid-row: 1 / span 3; }
    .summary { gap: 8px; } .tile { padding: 8px 10px; } .tile .who { display: none; }
  }

  @media (max-width: 600px) { header { flex-wrap: wrap; gap: 8px; } .grid { grid-template-columns: 1fr; } th:nth-child(n+4), td:nth-child(n+4) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Statement Downloader</h1>
  <nav>
    <a href="/" data-nav>Accounts</a>
    <a href="/review" data-nav>Review <span id="reviewBadge"></span></a>
    <a href="/issues" data-nav>Issues <span id="issueBadge"></span></a>
    <a href="/settings" data-nav>Settings</a>
  </nav>
  <span class="muted" id="machine" style="margin-left:auto;font-size:13px"></span>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const KEY = "__UI_KEY__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "–" : Number(v).toLocaleString("en-US", { style: "currency", currency: "USD" });
const when = v => v ? new Date(v).toLocaleString() : "–";
const day = v => v ? new Date(v + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "–";

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { ...opts, headers: { "X-SD-Key": KEY, ...(opts.headers || {}) } });
  if (!r.ok && r.status !== 202) throw new Error((await r.text()) || r.statusText);
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function post(path) { return api(path, { method: "POST" }); }
function errorText(e) { try { const j = JSON.parse(e.message); return j.error || j.message || e.message; } catch { return e.message; } }

/**
 * Runs a button's server call once at a time: the button and its neighbours are disabled and the
 * button says what's happening until it's done; a failure is shown instead of being lost.
 */
async function working(btn, label, work) {
  if (btn?.disabled) return;
  const group = btn ? [...btn.parentElement.querySelectorAll("button")] : [];
  const text = btn?.textContent;
  group.forEach(b => b.disabled = true);
  if (btn) btn.textContent = label;
  try { return await work(); }
  catch (e) { alert(errorText(e)); }
  finally { if (btn?.isConnected) { group.forEach(b => b.disabled = false); btn.textContent = text; } }
}

const NO_GROUP = "Other";
const store = {
  get(k, d) { try { const v = localStorage.getItem("sd:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sd:" + k, JSON.stringify(v)); } catch { } },
};
const tagsHtml = tags => (tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");

/** Groups items by .group (alphabetical, ungrouped last). Returns [[name, items]]. */
function byGroup(items) {
  const m = new Map();
  for (const x of items) { const g = x.group || NO_GROUP; if (!m.has(g)) m.set(g, []); m.get(g).push(x); }
  return [...m.entries()].sort(([a], [b]) => (a === NO_GROUP) - (b === NO_GROUP) || a.localeCompare(b));
}

/**
 * A message split into what to read and the technical part (automation logs, stack traces), which
 * is shown collapsed. [short, technical].
 */
function splitDetail(msg) {
  msg = String(msg ?? "");
  const m = msg.match(/^([\s\S]*?)(\s+Call log:|\s+at [\w.]+\(|\n)/);
  if (m && m[1].trim()) return [m[1].trim(), msg.slice(m[1].length).trim()];
  if (msg.length > 300) {
    const cut = msg.indexOf(". ", 80);
    return cut > 0 && cut < 300 ? [msg.slice(0, cut + 1), msg.slice(cut + 2)] : [msg.slice(0, 200) + "…", msg];
  }
  return [msg, ""];
}
const techHtml = t => t ? `<details class="tech"><summary>Technical details</summary><pre>${esc(t)}</pre></details>` : "";
const levelTone = { "action-needed": "bad", "heads-up": "warn", info: "ok" };

/** The button that fixes the cause of an issue, from its key (auth:<account>, clash:<document>, …). */
function issueFixes(i, onAccountPage) {
  const kind = i.key.split(":")[0], doc = i.key.split(":")[1], acct = i.accountId;
  let b = "";
  if (acct && (kind === "auth" || kind === "expiring")) b += `<button class="primary" onclick="run('${esc(acct)}','assist',this)">Sign in</button>`;
  else if (acct && ["documents", "run", "overdue", "stale"].includes(kind)) b += `<button class="primary" onclick="run('${esc(acct)}','check',this)">Check now</button>`;
  if (kind === "clash" || kind === "action") b += `<button onclick="openDoc('${esc(doc)}')">Open PDF</button><button onclick="showDoc('${esc(doc)}',this)">Show in folder</button>`;
  if (acct && !onAccountPage) b += `<a class="button" href="/accounts/${esc(acct)}" data-nav>Account</a>`;
  return b + `<button onclick="dismiss('${esc(i.key)}',this)">Dismiss</button>`;
}

function issueHtml(i, onAccountPage) {
  const [short, tech] = splitDetail(i.message);
  return `<div class="issue ${esc(i.level)}"><b>${esc(i.title)}</b><div class="what">${esc(short)}</div>${techHtml(tech)}
    ${i.openedUtc ? `<div class="when">Since ${when(i.openedUtc)}</div>` : ""}
    ${i.key ? `<div class="actions">${issueFixes(i, onAccountPage)}${i.key.startsWith("auth:") ? `<span class="muted">Dismissed, it comes back the next time a sign-in is needed.</span>` : ""}</div>` : ""}</div>`;
}

// ---- Accounts overview

const shortDay = v => new Date(v + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
/** The local day of a timestamp (not its UTC day). */
const localDay = (v, year) => new Date(v).toLocaleDateString(undefined, { month: "short", day: "numeric", ...(year ? { year: "numeric" } : {}) });
function ago(v) {
  const m = (Date.now() - new Date(v)) / 60000;
  if (m < 1) return "just now";
  if (m < 60) return `${Math.round(m)} min ago`;
  if (m < 60 * 24) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 60 / 24)} d ago`;
}
const needsYou = a => ["needs-assist", "broken"].includes(a.auth.status) || a.issues.some(i => i.level === "action-needed");
const openDoc = id => window.open(`/api/documents/${encodeURIComponent(id)}/file?key=${encodeURIComponent(KEY)}`, "_blank");
const showDoc = (id, btn) => working(btn, "Opening…", () => post(`/documents/${encodeURIComponent(id)}/show`));

/** What's going on with the account, in plain words: [tone, text]. Tone: ok, warn, bad or busy. */
function statusLine(a) {
  if (a.running) return ["busy", a.running === "assist" ? "Waiting for you in the browser window…" : "Checking now…"];
  if (a.auth.status === "assisting") return ["busy", "Signing in…"];
  if (a.auth.status === "needs-assist") return ["bad", "Needs you to sign in"];
  if (a.auth.status === "broken") return ["bad", `Can't sign in${a.auth.explain ? `: ${a.auth.explain}` : ""}`];
  const issue = a.issues.find(i => i.level === "action-needed");
  if (issue) return ["bad", issue.title.startsWith(a.name + ": ") ? issue.title.slice(a.name.length + 2) : issue.title];
  if (a.pendingReview) return ["warn", `${a.pendingReview} waiting for your review`];
  if (a.auth.status === "unknown") return ["warn", "Not signed in yet"];
  if (a.auth.status === "expiring-soon") return ["warn", "Sign-in expires soon"];
  const e = a.estimate;
  switch (a.decision.phase) {
    case "learning": return ["ok", "Learning the schedule"];
    case "overdue": return ["warn", `Late: expected by ${shortDay(e.windowEnd)} · checking daily`];
    case "stale": return ["warn", `Nothing new since ${shortDay(e.lastDocumentDate)} · checking weekly`];
    case "in-window": return ["ok", `Due now · checking until ${shortDay(e.windowEnd)}`];
  }
  return ["ok", e ? `Up to date · next due ~${shortDay(e.nextExpected)}` : "Up to date"];
}

/** The one button the account needs now: sign in, review, or check. */
function mainAction(a) {
  if (a.running || a.auth.status === "assisting") return `<button disabled>${a.running === "check" ? "Checking…" : "Signing in…"}</button>`;
  if (["needs-assist", "unknown", "expiring-soon", "broken"].includes(a.auth.status)) return `<button class="primary" onclick="run('${a.id}','assist',this)">Sign in</button>`;
  if (a.pendingReview) return `<a class="button primary" href="/review" data-nav>Review</a>`;
  return `<button onclick="run('${a.id}','check',this)">Check now</button>`;
}

/** Everything else, in a menu. */
function moreMenu(a) {
  const busy = a.running || a.auth.status === "assisting" ? "disabled" : "";
  const signInMain = ["needs-assist", "unknown", "expiring-soon", "broken"].includes(a.auth.status);
  const shared = (a.sharesSignInWith || []).length ? ` Also checks ${esc(a.sharesSignInWith.join(", "))}.` : "";
  const d = a.lastDocument;
  return `<details class="more"><summary title="More" aria-label="More actions for ${esc(a.name)}">⋯</summary><div class="menu">
    ${signInMain ? `<button ${busy} onclick="run('${a.id}','check',this)">Check now</button>`
      : `<button ${busy} onclick="run('${a.id}','assist',this)">Sign in now<span class="sub">Opens a browser window, signs in, then checks for new ${esc(a.kind)}s.${shared}</span></button>`}
    ${d ? `<button onclick="openDoc('${d.id}')">Open latest ${esc(a.kind)}</button><button onclick="showDoc('${d.id}',this)">Show in folder</button>` : ""}
    <a href="/accounts/${a.id}" data-nav>Details and history</a>
  </div></details>`;
}

function accountRow(a) {
  const [tone, text] = statusLine(a);
  const d = a.lastDocument;
  const fresh = d?.firstSeenUtc && Date.now() - new Date(d.firstSeenUtc) < 7 * 864e5;
  const mode = a.signIn && a.signIn.mode !== "own" ? `<span class="mode ${a.signIn.mode}" title="${esc(a.signIn.detail)}">${a.signIn.mode === "every-time" ? "you sign in" : "remembered"}</span>` : "";
  return `<div class="arow">
    <div class="c-name"><span class="dot ${tone}"></span><a href="/accounts/${a.id}" data-nav title="${esc(a.signIn?.title || "")}: ${esc(a.signIn?.detail || "")}">${esc(a.name)}</a>${mode}</div>
    <div class="c-latest">${d ? `${day(d.date)} · ${money(d.amount)}${fresh ? `<span class="new">NEW</span>` : ""} <button class="linkbtn" onclick="openDoc('${d.id}')" title="Open the PDF">Open</button>`
      : `<span class="muted">No ${esc(a.kind)}s yet</span>`}</div>
    <div class="c-status ${tone}">${esc(text)}<div class="sub">${a.lastCheckedUtc ? `Checked ${ago(a.lastCheckedUtc)}` : "Not checked yet"}</div></div>
    <div class="c-act">${mainAction(a)}${moreMenu(a)}</div>
  </div>`;
}

/** Does anything need me? Then what's waiting, and what came in. */
function summaryHtml(accounts) {
  const needs = accounts.filter(needsYou);
  const review = accounts.filter(a => a.pendingReview);
  const fresh = accounts.filter(a => a.newThisWeek);
  const count = (list, f) => list.reduce((n, a) => n + f(a), 0);
  const names = list => esc(list.map(a => a.name).join(", "));
  const tile = (n, label, tone, who, href) => `<${href ? `a href="${href}" data-nav` : "div"} class="tile ${n ? tone : ""}">
      <div class="n">${n}</div><div class="l">${label}</div><div class="who" title="${who}">${who || "&nbsp;"}</div></${href ? "a" : "div"}>`;
  const reviewCount = count(review, a => a.pendingReview), freshCount = count(fresh, a => a.newThisWeek);
  const tiles = `<div class="summary">
    ${tile(needs.length, needs.length === 1 ? "account needs you" : "accounts need you", "bad", names(needs), null)}
    ${tile(reviewCount, "waiting for review", "warn", names(review), reviewCount ? "/review" : null)}
    ${tile(freshCount, `new ${freshCount === 1 ? "document" : "documents"} this week`, "ok", names(fresh), null)}
  </div>`;
  const first = [...needs, ...review.filter(a => !needs.includes(a))];
  return tiles + (first.length ? `<div class="list attention"><div class="lhead">Needs attention</div>${first.map(accountRow).join("")}</div>` : "");
}

let dashTags = store.get("dashTags", []);
let collapsed = store.get("collapsed", []);

async function renderDashboard() {
  const s = await api("/status");
  $("#machine").textContent = s.machine;
  if (!s.accounts.length) return `<div class="empty">No accounts configured yet. Add them on the Settings page or in your config file.</div>`;
  const allTags = [...new Set(s.accounts.flatMap(a => a.tags || []))].sort();
  dashTags = dashTags.filter(t => allTags.includes(t));
  const shown = dashTags.length ? s.accounts.filter(a => (a.tags || []).some(t => dashTags.includes(t))) : s.accounts;
  const chips = allTags.length ? `<div class="chips" style="margin-bottom:6px"><span class="muted" style="font-size:13px">Show:</span>
      ${allTags.map(t => `<button class="chip ${dashTags.includes(t) ? "on" : ""}" onclick="toggleDashTag('${esc(t)}')">${esc(t)}</button>`).join("")}
      ${dashTags.length ? `<a href="#" onclick="dashTags=[];store.set('dashTags',dashTags);render();return false" style="font-size:13px">clear</a>` : ""}</div>` : "";
  const top = summaryHtml(s.accounts);
  if (!shown.length) return top + chips + `<div class="empty">No accounts have the selected tags.</div>`;
  const groups = byGroup(shown);
  if (groups.length === 1 && groups[0][0] === NO_GROUP) return top + chips + `<div class="list">${shown.map(accountRow).join("")}</div>`;
  return top + chips + groups.map(([g, list]) => {
    const isCollapsed = collapsed.includes(g);
    const needs = list.filter(a => ["needs-assist", "broken"].includes(a.auth.status) || a.issues.some(i => i.level === "action-needed")).length;
    return `<div class="group-head ${isCollapsed ? "collapsed" : ""}" onclick="toggleGroup('${esc(g).replace(/'/g, "&#39;")}')">
        <span class="caret">▾</span><h2>${esc(g)}</h2><span class="muted">${list.length} account${list.length === 1 ? "" : "s"}</span>
        ${needs ? `<span class="pill s-needs-assist">${needs} need${needs === 1 ? "s" : ""} you</span>` : ""}</div>
      ${isCollapsed ? "" : `<div class="list">${list.map(accountRow).join("")}</div>`}`;
  }).join("");
}

function toggleDashTag(t) {
  dashTags = dashTags.includes(t) ? dashTags.filter(x => x !== t) : [...dashTags, t];
  store.set("dashTags", dashTags); render();
}
function toggleGroup(g) {
  g = g.replace(/&#39;/g, "'");
  collapsed = collapsed.includes(g) ? collapsed.filter(x => x !== g) : [...collapsed, g];
  store.set("collapsed", collapsed); render();
}

const reasonText = {
  "verification-code": "the site asked for a code", captcha: "a human check didn't pass", "session-expired": "the sign-in had expired",
  "password-rejected": "the site rejected the password", "site-changed": "the site's pages looked different", "site-unavailable": "couldn't reach the site",
  "assist-abandoned": "the window closed before signing in", "credential-unavailable": "couldn't read the login", "attended-only": "skipped: it needed you there",
};

/** When documents come, and how SD checks for them, in words. */
function scheduleText(a) {
  const e = a.estimate, k = a.kind;
  if (!e) return a.schedule === "auto (learned)"
    ? `SD learns when ${esc(k)}s come once it has 3 of them (it has ${a.documentCount}). Until then it checks once a day.`
    : `SD checks ${esc(a.schedule)}.`;
  const delay = e.postingDelayDays <= 1 ? "the day after its date" : `about ${e.postingDelayDays} days after its date`;
  return `A new ${esc(k)} usually comes every <b>${e.intervalDays} days</b> (give or take ${e.spreadDays}) and is online ${delay}.
    The next is expected around <b>${day(e.nextExpected)}</b>. SD checks for it from ${shortDay(e.windowStart)} to ${shortDay(e.windowEnd)},
    after signing in once beforehand to make sure the login still works; if it's late, SD checks daily and tells you.`;
}

function accountHead(a) {
  const [tone, text] = statusLine(a);
  const busy = a.running || a.auth.status === "assisting" ? "disabled" : "";
  const signInFirst = ["needs-assist", "unknown", "expiring-soon", "broken"].includes(a.auth.status);
  const shared = (a.sharesSignInWith || []).length ? ` One sign-in also covers ${esc(a.sharesSignInWith.join(", "))}.` : "";
  const d = a.lastDocument;
  return `<div class="card acct-head">
    <h2>${esc(a.name)}${tagsHtml(a.tags)}</h2>
    <div class="state ${tone}"><span class="dot ${tone}"></span>${esc(text)}</div>
    <div class="sub">${a.lastCheckedUtc ? `Checked ${ago(a.lastCheckedUtc)}` : "Not checked yet"}${a.lastRun ? ` · ${esc(a.lastRun)}` : ""}</div>
    ${a.signIn ? `<p class="sub"><b>${esc(a.signIn.title)}.</b> ${esc(a.signIn.detail)}${shared}</p>` : ""}
    ${a.issues.map(i => issueHtml(i, true)).join("")}
    <div class="actions">
      <button class="${signInFirst ? "primary" : ""}" ${busy} onclick="run('${a.id}','assist',this)" title="Opens a browser window, signs in, then checks for new ${esc(a.kind)}s">Sign in now</button>
      <button class="${signInFirst ? "" : "primary"}" ${busy} onclick="run('${a.id}','check',this)">Check now</button>
      ${d ? `<button onclick="openDoc('${d.id}')">Open latest ${esc(a.kind)}</button><button onclick="showDoc('${d.id}',this)">Show in folder</button>` : ""}
    </div>
  </div>`;
}

/** Documents by year (the newest year open), with only the columns that have something in them. */
function documentsHtml(a, documents) {
  if (!documents.length) return `<div class="empty">No ${esc(a.kind)}s on record. <button onclick="importHistory('${a.id}',this)">Import from folder</button></div>`;
  const hasNumber = documents.some(x => x.statementNumber), hasActions = documents.some(x => (x.actions || []).length);
  const imported = documents.filter(x => x.imported).length;
  const note = `<p class="sub" style="margin:-4px 0 10px">${documents.length - imported} downloaded by SD${imported ? ` · ${imported} imported from your folder` : ""}</p>`;
  const years = new Map();
  for (const x of documents) { const y = String(x.date).slice(0, 4); if (!years.has(y)) years.set(y, []); years.get(y).push(x); }
  const table = list => `<table><tr><th>Date</th><th>Amount</th>${hasNumber ? "<th>Number</th>" : ""}${hasActions ? "<th>Actions</th>" : ""}<th>File</th></tr>
    ${list.map(x => `<tr><td>${day(x.date)}${x.review === "pending" ? ' <span class="pill">review</span>' : ""}${!x.imported && x.firstSeenUtc ? `<div class="sub">downloaded ${localDay(x.firstSeenUtc)}</div>` : ""}</td>
      <td>${money(x.amount)}</td>${hasNumber ? `<td>${esc(x.statementNumber || "–")}</td>` : ""}
      ${hasActions ? `<td>${(x.actions || []).map(r => `<div class="${r.succeeded ? "s-healthy" : "s-broken"}">${esc(r.summary || r.type)}</div>`).join("") || '<span class="muted">–</span>'}</td>` : ""}
      <td><code>${esc(x.path.split(/[\\/]/).pop())}</code><br><button class="linkbtn" onclick="openDoc('${x.id}')">Open</button> · <button class="linkbtn" onclick="showDoc('${x.id}',this)">Show in folder</button></td></tr>`).join("")}</table>`;
  return note + [...years.entries()].map(([y, list], i) =>
    `<details class="year" ${i === 0 ? "open" : ""}><summary>${y} <span class="muted">· ${list.length} ${esc(a.kind)}${list.length === 1 ? "" : "s"}</span></summary>${table(list)}</details>`).join("");
}

function signInsHtml(signIns) {
  if (!signIns.length) return `<div class="empty">No sign-ins yet.</div>`;
  const machines = new Set(signIns.map(e => e.machine)).size > 1;
  const row = e => `<tr><td>${when(e.atUtc)}</td>
    <td class="${e.succeeded ? "s-healthy" : "s-broken"}">${e.succeeded ? "Signed in" : esc(reasonText[e.reason] || e.reason)}${e.detail ? ` <span class="muted">${esc(splitDetail(e.detail)[0])}</span>` : ""}</td>
    <td>${e.assisted ? "with you" : "on its own"}</td><td>${e.rememberedUntilUtc ? localDay(e.rememberedUntilUtc, true) : "–"}</td>${machines ? `<td>${esc(e.machine)}</td>` : ""}</tr>`;
  const head = `<tr><th>When</th><th>Result</th><th>How</th><th>Remembered until</th>${machines ? "<th>Computer</th>" : ""}</tr>`;
  const recent = signIns.slice(0, 6), older = signIns.slice(6);
  return `<table>${head}${recent.map(row).join("")}</table>
    ${older.length ? `<details class="year" style="margin-top:10px"><summary><span class="muted">${older.length} earlier sign-in${older.length === 1 ? "" : "s"}</span></summary><table>${head}${older.map(row).join("")}</table></details>` : ""}`;
}

async function renderAccount(id, assist) {
  const d = await api("/accounts/" + encodeURIComponent(id));
  const a = d.account;
  const callout = assist && a.auth.status !== "healthy" ? `<div class="callout"><b>Sign in to ${esc(a.name)}</b>
    <p>Choosing <b>Sign in now</b> opens a browser window on this computer with your username and password filled in.
    Finish whatever the site asks (verification code, CAPTCHA) and tick “remember me” if it's offered. Any waiting ${esc(a.kind)}s are downloaded right after.</p></div>` : "";
  return `${callout}${accountHead(a)}
    <h3>When ${esc(a.kind)}s come</h3>
    <div class="card"><p style="margin:0">${scheduleText(a)}</p>
      <p class="sub" style="margin:8px 0 0">Saved to <code>${esc(a.folder)}</code></p></div>
    <h3>${esc(a.kind[0].toUpperCase() + a.kind.slice(1))}s</h3>${documentsHtml(a, d.documents)}
    <h3>Sign-ins</h3>${signInsHtml(d.signIns)}`;
}

async function renderReview() {
  const items = await api("/review");
  if (!items.length) return `<div class="empty">Nothing waiting for review.</div>`;
  return `<table><tr><th>Account</th><th>Date</th><th>Amount</th><th>Statement #</th><th>Will run</th><th></th></tr>
    ${items.map(x => `<tr><td>${esc(x.account)}</td><td>${day(x.date)}</td><td>${money(x.amount)}</td><td>${esc(x.statementNumber || "–")}</td>
      <td>${esc((x.actions || []).join(", "))}</td>
      <td style="white-space:nowrap"><button onclick="openDoc('${x.id}')">Open PDF</button> <button class="primary" onclick="review('${x.id}','approve',this)">Approve</button> <button onclick="review('${x.id}','reject',this)">Reject</button></td></tr>`).join("")}</table>`;
}

async function renderIssues() {
  const d = await api("/issues");
  const needs = d.open.filter(i => i.level === "action-needed"), fyi = d.open.filter(i => i.level !== "action-needed");
  const timeOf = v => new Date(v).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
  const entries = [
    ...d.held.map(h => ({ at: h.queuedUtc, n: h.notification,
      where: h.digest ? `in the daily summary, ${timeOf(h.releaseAfterUtc)}` : `held for quiet hours until ${timeOf(h.releaseAfterUtc)}` })),
    ...d.recent.map(r => ({ at: r.atUtc, n: r.notification, error: r.error,
      where: (r.channels || []).length ? `sent to ${r.channels.join(", ")}` : "not sent (app only)" })),
  ].sort((x, y) => (y.at ? new Date(y.at) : Infinity) - (x.at ? new Date(x.at) : Infinity));
  const activity = entries.length ? `<div class="list">${entries.map(x => {
      const [short, tech] = splitDetail(x.n.message);
      return `<div class="act"><span class="dot ${levelTone[x.n.level] || "ok"}"></span>
        <div><b>${esc(x.n.title)}</b><div class="sub">${esc(short)}</div>${techHtml(tech)}${x.error ? `<div class="s-broken sub">Couldn't send: ${esc(x.error)}</div>` : ""}</div>
        <div class="meta">${x.at ? when(x.at) : "not sent yet"}<br>${esc(x.where)}</div></div>`;
    }).join("")}</div>` : `<div class="empty">Nothing has happened yet.</div>`;
  return `<h3 style="margin-top:0">Needs you</h3>
    ${needs.length > 1 ? `<div class="actions" style="margin:0 0 4px"><button onclick="dismissAll(this)">Dismiss all</button></div>` : ""}
    ${needs.length ? needs.map(i => issueHtml(i)).join("") : `<div class="empty">Nothing needs you right now.</div>`}
    ${fyi.length ? `<h3>Worth knowing</h3>${fyi.map(i => issueHtml(i)).join("")}` : ""}
    <h3>Activity</h3>${activity}
    <div class="actions"><button onclick="testNotify(this)">Send test notification</button>${d.recent.length ? `<button onclick="clearHistory(this)">Clear sent history</button>` : ""}</div>`;
}

const TOKENS_HELP = `Tokens: <code>{year}</code> <code>{month}</code> <code>{date:yyyy-MM-dd}</code> <code>{statement}</code> (statement or invoice number) <code>{account}</code> <code>{kind}</code>. Use <code>/</code> between folder levels.`;
let settingsData = null, editingId = null, editingRoot = false, settingsFilter = "";

async function renderSettings() {
  settingsData = await api("/settings");
  editingId = null; editingRoot = false;
  const d = settingsData;
  return `<div class="card" id="rootCard">${rootHtml()}</div>
    <div class="toolbar">
      <input type="search" id="acctFilter" placeholder="Filter by account, group, tag, site or folder" value="${esc(settingsFilter)}" aria-label="Filter accounts">
      <span class="muted" id="acctCount"></span>
    </div>
    <div class="list" id="acctList">${listHtml()}</div>
    <datalist id="folderSuggest"></datalist>
    <datalist id="groupSuggest">${(d.groups || []).map(g => `<option value="${esc(g)}">`).join("")}</datalist>
    <p class="hint">${TOKENS_HELP} Changes only affect new documents; files already saved stay where they are.</p>
    <p class="hint">Saved to <code>${esc(d.configFile)}</code>. Comments are kept, the previous version is kept as <code>config.yaml.bak</code>, and changes take effect immediately.</p>`;
}

function rootHtml() {
  const d = settingsData;
  if (!editingRoot) return `<div class="lrow" style="padding:0">
      <div class="lmain"><b>Base folder</b> <span class="muted">— every account's folder is inside this one</span>
        <div class="path" style="font-size:14px;color:var(--text)">${esc(d.documentsRoot)}</div>
        ${d.documentsRootExists ? "" : `<div class="hint s-broken">This folder doesn't exist on this computer.</div>`}</div>
      <button onclick="editRoot()">Change</button></div>`;
  return `<b>Base folder</b>
    <div class="muted">It can differ on each computer — for example your Google Drive folder on Windows and on a Mac.</div>
    <label for="root">Base folder on this computer</label>
    <input type="text" id="root" value="${esc(d.documentsRoot)}" data-original="${esc(d.documentsRoot)}" spellcheck="false">
    <div class="rowbtns"><button class="primary" onclick="saveRoot(this)">Save</button><button onclick="cancelEdit()">Cancel</button><span class="msg"></span></div>`;
}

function listHtml() {
  const d = settingsData;
  if (!d.accounts.length) return `<div class="empty">No accounts configured.</div>`;
  const groups = byGroup(d.accounts);
  const showHeads = !(groups.length === 1 && groups[0][0] === NO_GROUP);
  return groups.map(([g, list]) => (showHeads ? `<div class="lhead" data-group="${esc(g)}">${esc(g)}</div>` : "")
    + list.map(a => `<div class="lrow" data-account="${esc(a.id)}" data-in-group="${esc(g)}">${rowHtml(a)}</div>`).join("")).join("");
}

function rowHtml(a) {
  return `<div class="lmain"><b>${esc(a.name)}</b> <span class="muted">${esc(a.site)}</span>${tagsHtml(a.tags)}
      ${(a.sharesSignInWith || []).length ? `<span class="muted" style="font-size:12.5px"> · same sign-in as ${esc(a.sharesSignInWith.join(", "))}</span>` : ""}
      <div class="path" title="${esc(a.example)}">${esc(a.relative)}</div></div>
    <button onclick="editAccount('${esc(a.id)}')">Edit</button>`;
}

function editorHtml(a) {
  return `<b>${esc(a.name)}</b> <span class="muted">${esc(a.site)}</span>
    <div class="fields">
      <div><label for="f-group">Group <span class="muted" style="font-weight:400">— the section it's listed under</span></label>
        <input type="text" id="f-group" data-field="group" list="groupSuggest" value="${esc(a.group || "")}" data-original="${esc(a.group || "")}" placeholder="e.g. Maple Street Rentals" autocomplete="off"></div>
      <div><label for="f-tags">Tags <span class="muted" style="font-weight:400">— comma-separated</span></label>
        <input type="text" id="f-tags" data-field="tags" value="${esc((a.tags || []).join(", "))}" data-original="${esc((a.tags || []).join(", "))}" placeholder="e.g. utility, gas" autocomplete="off">
        ${tagPicker(a.tags)}</div>
      <div><label for="f-folder">Folder <span class="muted" style="font-weight:400">— inside the base folder</span></label>
        <input type="text" id="f-folder" data-field="folder" list="folderSuggest" value="${esc(a.folder)}" data-original="${esc(a.folder)}" spellcheck="false" autocomplete="off"></div>
      <div><label for="f-file">File name</label>
        <input type="text" id="f-file" data-field="fileName" value="${esc(a.fileName)}" data-original="${esc(a.fileName)}" spellcheck="false"></div>
    </div>
    <div class="preview" data-preview title="${esc(a.example)}">${esc(a.relative)}</div>
    <div class="rowbtns"><button class="primary" onclick="saveAccount(this)">Save</button><button onclick="cancelEdit()">Cancel</button>
      <span class="muted">Example: where the latest document on record would be saved.</span><span class="msg"></span></div>`;
}

function tagPicker(current) {
  const others = (settingsData.tags || []).filter(t => !(current || []).includes(t));
  return others.length ? `<div class="chips" style="margin-top:6px">${others.map(t => `<button type="button" class="chip" onclick="addTag('${esc(t)}')">+ ${esc(t)}</button>`).join("")}</div>` : "";
}
function addTag(t) {
  const input = $("#f-tags");
  const tags = input.value.split(",").map(x => x.trim()).filter(Boolean);
  if (!tags.includes(t)) tags.push(t);
  input.value = tags.join(", ");
  input.dispatchEvent(new Event("input", { bubbles: true }));
}

function settingsDirty() {
  return [...document.querySelectorAll("main input[data-original]")].some(i => i.value !== i.dataset.original);
}

function confirmDiscard() { return !settingsDirty() || confirm("Discard your unsaved changes?"); }

function closeEditors() {
  if (editingId) {
    const row = document.querySelector(`[data-account="${CSS.escape(editingId)}"]`);
    const a = settingsData.accounts.find(x => x.id === editingId);
    if (row && a) { row.classList.remove("editing"); row.innerHTML = rowHtml(a); }
  }
  if (editingRoot) { editingRoot = false; $("#rootCard").innerHTML = rootHtml(); }
  editingId = null;
}

function editAccount(id) {
  if (!confirmDiscard()) return;
  closeEditors();
  editingId = id;
  const row = document.querySelector(`[data-account="${CSS.escape(id)}"]`);
  row.classList.add("editing");
  row.innerHTML = editorHtml(settingsData.accounts.find(x => x.id === id));
  const input = row.querySelector("#f-folder");
  input.focus(); input.setSelectionRange(input.value.length, input.value.length);
  suggestFolders(input.value);
}

function editRoot() {
  if (!confirmDiscard()) return;
  closeEditors();
  editingRoot = true;
  $("#rootCard").innerHTML = rootHtml();
  $("#root").focus();
}

function cancelEdit() { if (confirmDiscard()) closeEditors(); }

function setMsg(container, html) { const m = container.querySelector(".msg"); if (m) m.innerHTML = html; }

async function postSettings(body) {
  try {
    settingsData = await api("/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return null;
  } catch (e) { try { return JSON.parse(e.message).error || e.message; } catch { return e.message; } }
}

async function saveAccount(btn) {
  const row = document.querySelector(".lrow.editing");
  const id = editingId;
  const error = await working(btn, "Saving…", () => postSettings({ accounts: [{ id, folder: $("#f-folder").value, fileName: $("#f-file").value,
    group: $("#f-group").value, tags: $("#f-tags").value.split(",").map(t => t.trim()).filter(Boolean) }] }));
  if (error) return setMsg(row, `<span class="s-broken">${esc(error)}</span>`);
  editingId = null;
  $("#acctList").innerHTML = listHtml();
  $("#groupSuggest").innerHTML = (settingsData.groups || []).map(g => `<option value="${esc(g)}">`).join("");
  applyFilter();
  const moved = document.querySelector(`[data-account="${CSS.escape(id)}"]`);
  moved.scrollIntoView({ block: "nearest" });
  moved.classList.add("saved");
}

async function saveRoot(btn) {
  const error = await working(btn, "Saving…", () => postSettings({ documentsRoot: $("#root").value }));
  if (error) return setMsg($("#rootCard"), `<span class="s-broken">${esc(error)}</span>`);
  editingRoot = false;
  $("#rootCard").innerHTML = rootHtml();
  for (const a of settingsData.accounts) {
    const row = document.querySelector(`[data-account="${CSS.escape(a.id)}"]`);
    if (row && !row.classList.contains("editing")) row.innerHTML = rowHtml(a);
  }
}

function applyFilter() {
  const rows = [...document.querySelectorAll("[data-account]")];
  const q = settingsFilter.trim().toLowerCase();
  let shown = 0;
  for (const row of rows) {
    const a = settingsData.accounts.find(x => x.id === row.dataset.account);
    const hit = !q || row.classList.contains("editing") || [a.name, a.id, a.site, a.group || "", ...(a.tags || []), a.folder, a.fileName, a.relative].some(v => String(v).toLowerCase().includes(q));
    row.style.display = hit ? "" : "none";
    if (hit) shown++;
  }
  for (const head of document.querySelectorAll("#acctList .lhead"))
    head.style.display = rows.some(r => r.dataset.inGroup === head.dataset.group && r.style.display !== "none") ? "" : "none";
  const c = $("#acctCount");
  if (c) c.textContent = q ? `${shown} of ${rows.length} accounts` : `${rows.length} account${rows.length === 1 ? "" : "s"}`;
}

let previewTimer, folderTimer, folderParent = null;
function onSettingsInput(e) {
  if (e.target.id === "acctFilter") { settingsFilter = e.target.value; return applyFilter(); }
  if (!editingId) return;
  if (e.target.id === "f-folder") suggestFolders(e.target.value);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const box = document.querySelector(".lrow.editing [data-preview]");
    if (!box) return;
    const q = new URLSearchParams({ account: editingId, folder: $("#f-folder").value, fileName: $("#f-file").value });
    try {
      const r = await api("/settings/preview?" + q);
      box.classList.toggle("bad", !!r.problem);
      box.textContent = r.problem || r.relative;
      box.title = r.path || "";
    } catch (err) { box.classList.add("bad"); box.textContent = err.message; }
  }, 200);
}

// Suggest existing subfolders of whatever folder has been typed so far.
function suggestFolders(value) {
  const parent = value.includes("/") ? value.slice(0, value.lastIndexOf("/")) : "";
  if (parent === folderParent || /[{}]/.test(parent)) return;
  folderParent = parent;
  clearTimeout(folderTimer);
  folderTimer = setTimeout(async () => {
    try {
      const r = await api("/settings/folders?" + new URLSearchParams({ under: parent }));
      const list = $("#folderSuggest");
      if (list) list.innerHTML = r.folders.flatMap(f => [f, f + "/{year}"]).map(f => `<option value="${esc(f)}">`).join("");
    } catch { }
  }, 150);
}

document.addEventListener("input", e => { if (e.target.closest("main") && location.pathname === "/settings") onSettingsInput(e); });
document.addEventListener("keydown", e => {
  if (location.pathname !== "/settings") return;
  if (e.key === "Escape" && (editingId || editingRoot)) cancelEdit();
  if (e.key === "Enter" && e.target.matches(".lrow.editing input")) saveAccount();
  if (e.key === "Enter" && e.target.id === "root") saveRoot();
});
window.addEventListener("beforeunload", e => { if (location.pathname === "/settings" && settingsDirty()) e.preventDefault(); });

async function refreshBadges() {
  try {
    const [issues, review] = await Promise.all([api("/issues"), api("/review")]);
    const n = issues.open.filter(i => i.level === "action-needed").length;
    $("#issueBadge").innerHTML = n ? `<span class="badge">${n}</span>` : "";
    $("#reviewBadge").innerHTML = review.length ? `<span class="badge">${review.length}</span>` : "";
  } catch { }
}

let timer;
async function render() {
  clearTimeout(timer);
  const p = location.pathname;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === p || (p.startsWith("/accounts") && a.getAttribute("href") === "/")));
  try {
    const html = p.startsWith("/accounts/") ? await renderAccount(decodeURIComponent(p.split("/")[2]), new URLSearchParams(location.search).has("assist"))
      : p === "/review" ? await renderReview() : p === "/issues" ? await renderIssues() : p === "/settings" ? await renderSettings() : await renderDashboard();
    $("#main").innerHTML = html;
    if (p === "/settings") { folderParent = null; applyFilter(); }
  } catch (e) { $("#main").innerHTML = `<div class="issue"><b>Couldn't load</b>${esc(e.message)}</div>`; }
  refreshBadges();
  // The settings page isn't refreshed on a timer, so it never wipes what you're typing.
  if (p !== "/settings") timer = setTimeout(renderUnlessMenuOpen, document.querySelector("[disabled]") ? 3000 : 30000);
}
/** A refresh would close an open menu under the pointer: wait until it's closed. */
function renderUnlessMenuOpen() {
  if (document.querySelector("details.more[open]")) { timer = setTimeout(renderUnlessMenuOpen, 3000); return; }
  render();
}

async function run(id, kind, btn) {
  await working(btn, "Starting…", async () => {
    await post(`/accounts/${encodeURIComponent(id)}/${kind}`);
    await new Promise(r => setTimeout(r, 400));
  });
  render();
}
async function review(id, decision, btn) {
  // Approving runs the actions, which can take a while.
  await working(btn, decision === "approve" ? "Approving…" : "Rejecting…", () => post(`/review/${id}/${decision}`));
  render();
}
async function testNotify(btn) {
  const r = await working(btn, "Sending…", () => post("/notifications/test"));
  if (r) alert(r.length ? r.map(x => `${x.channel}: ${x.ok ? "sent" : x.error}`).join("\n") : "No notification channels are configured.");
}
async function dismiss(key, btn) { await working(btn, "Dismissing…", () => post(`/issues/${encodeURIComponent(key)}/dismiss`)); render(); }
async function dismissAll(btn) {
  if (!confirm("Dismiss all open issues? Any that still apply come back on a later check.")) return;
  await working(btn, "Dismissing…", () => post("/issues/dismiss-all")); render();
}
async function clearHistory(btn) {
  if (!confirm("Clear the list of past notifications?")) return;
  await working(btn, "Clearing…", () => post("/notifications/clear")); render();
}
async function importHistory(id, btn) {
  const r = await working(btn, "Importing…", () => post(`/accounts/${encodeURIComponent(id)}/import-history`));
  if (r) alert(`Imported ${r.added} document(s).`);
  render();
}

document.addEventListener("click", e => {
  // Close any open "more" menu when clicking elsewhere (or on one of its items).
  document.querySelectorAll("details.more[open]").forEach(m => { if (!m.contains(e.target) || e.target.closest(".menu")) m.open = false; });
  const a = e.target.closest("a[data-nav]");
  if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  if (location.pathname === "/settings" && settingsDirty() && !confirm("Leave without saving your changes?")) return;
  history.pushState(null, "", a.getAttribute("href"));
  render();
});
window.addEventListener("popstate", render);
render();
</script>
</body>
</html>
