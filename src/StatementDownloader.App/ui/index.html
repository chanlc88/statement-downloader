<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement Downloader</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
    --accent: #2f5bd3; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0362c; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e7eaf0; --muted: #9aa3b2; --line: #2c323c;
            --accent: #7c9cff; --ok: #4cc283; --warn: #f0b04a; --bad: #ff7a6e; --chip: #262b34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 17px; margin: 0; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 18px; font-weight: 500; }
  nav a.active { color: var(--text); }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 12px; text-align: center; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card h2 a { color: inherit; text-decoration: none; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row span:first-child { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--chip); }
  .s-healthy { color: var(--ok); } .s-expiring-soon { color: var(--warn); } .s-needs-assist, .s-broken { color: var(--bad); } .s-assisting { color: var(--accent); }
  .issue { border-left: 4px solid var(--bad); background: var(--chip); padding: 8px 12px; border-radius: 6px; margin: 10px 0 0; }
  .issue.heads-up { border-color: var(--warn); } .issue.info { border-color: var(--accent); }
  .issue b { display: block; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  h3 { margin: 28px 0 10px; font-size: 15px; }
  .callout { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; }
  code { font-size: 13px; }
  label { display: block; font-weight: 600; font-size: 13.5px; margin: 12px 0 4px; }
  input[type=text] { width: 100%; font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .preview { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--chip); border-radius: 7px; padding: 7px 10px; margin-top: 10px; word-break: break-all; }
  .preview.bad { color: var(--bad); font-family: inherit; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; }
  .toolbar input[type=search] { flex: 1; max-width: 420px; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .lrow:first-child { border-top: 0; }
  .lrow .lmain { flex: 1; min-width: 0; }
  .lrow .path { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow.editing { display: block; background: var(--chip); }
  .lrow.editing .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .lrow.saved { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--ok) 22%, transparent); } to { background: transparent; } }
  .rowbtns { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .rowbtns button { white-space: nowrap; }
  @media (max-width: 700px) { .lrow.editing .fields { grid-template-columns: 1fr; } }

  @media (max-width: 600px) { header { flex-wrap: wrap; gap: 8px; } .grid { grid-template-columns: 1fr; } th:nth-child(n+4), td:nth-child(n+4) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Statement Downloader</h1>
  <nav>
    <a href="/" data-nav>Accounts</a>
    <a href="/review" data-nav>Review <span id="reviewBadge"></span></a>
    <a href="/issues" data-nav>Issues <span id="issueBadge"></span></a>
    <a href="/settings" data-nav>Settings</a>
  </nav>
  <span class="muted" id="machine" style="margin-left:auto;font-size:13px"></span>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const KEY = "__UI_KEY__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "–" : Number(v).toLocaleString("en-US", { style: "currency", currency: "USD" });
const when = v => v ? new Date(v).toLocaleString() : "–";
const day = v => v ? new Date(v + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "–";
const statusText = { unknown: "Not signed in yet", healthy: "Signed in", "expiring-soon": "Expiring soon", "needs-assist": "Needs you", assisting: "Signing in…", broken: "Can't sign in" };
const phaseText = { learning: "Learning cycle", quiet: "Quiet", preflight: "Pre-flight", "in-window": "In window", overdue: "Overdue", stale: "No new document", interval: "Interval" };

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { ...opts, headers: { "X-SD-Key": KEY, ...(opts.headers || {}) } });
  if (!r.ok && r.status !== 202) throw new Error((await r.text()) || r.statusText);
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function post(path) { return api(path, { method: "POST" }); }

function issueHtml(i) {
  return `<div class="issue ${esc(i.level)}"><b>${esc(i.title)}</b>${esc(i.message)}
    ${i.key && !i.key.startsWith("auth:") ? `<div class="actions"><button onclick="dismiss('${esc(i.key)}')">Dismiss</button></div>` : ""}</div>`;
}

function accountButtons(a) {
  const busy = a.running ? "disabled" : "";
  const assistFirst = ["needs-assist", "unknown", "expiring-soon"].includes(a.auth.status);
  return `<div class="actions">
    <button class="${assistFirst ? "primary" : ""}" ${busy} onclick="run('${a.id}','assist')">Sign in now</button>
    <button class="${assistFirst ? "" : "primary"}" ${busy} onclick="run('${a.id}','check')">Check now</button>
    ${a.running ? `<span class="muted">${a.running === "assist" ? "Waiting for you in the browser window…" : "Checking…"}</span>` : ""}
  </div>`;
}

function windowText(a) {
  const e = a.estimate;
  if (!e) return a.schedule === "auto (learned)" ? `Learning (${a.documentCount}/3 documents)` : a.schedule;
  return `${day(e.windowStart)} – ${day(e.windowEnd)} <span class="muted">(~every ${e.intervalDays}d ±${e.spreadDays})</span>`;
}

function card(a) {
  return `<div class="card">
    <h2><a href="/accounts/${a.id}" data-nav>${esc(a.name)}</a></h2>
    <div class="muted" style="margin-bottom:8px">${esc(a.site)} · ${esc(a.kind)}s</div>
    <div class="row"><span>Sign-in</span><span class="pill s-${a.auth.status}">${statusText[a.auth.status] || a.auth.status}</span></div>
    <div class="row"><span>Last ${esc(a.kind)}</span><span>${a.lastDocument ? `${day(a.lastDocument.date)} · ${money(a.lastDocument.amount)}` : "none yet"}</span></div>
    <div class="row"><span>Next expected</span><span>${windowText(a)}</span></div>
    <div class="row"><span>Now</span><span>${phaseText[a.decision.phase] || a.decision.phase} <span class="muted">— ${esc(a.decision.reason)}</span></span></div>
    ${a.lastRun ? `<div class="row"><span>Last run</span><span>${esc(a.lastRun)}</span></div>` : ""}
    ${a.issues.map(issueHtml).join("")}
    ${accountButtons(a)}
  </div>`;
}

async function renderDashboard() {
  const s = await api("/status");
  $("#machine").textContent = s.machine;
  if (!s.accounts.length) return `<div class="empty">No accounts configured yet. Add them to your config file and restart.</div>`;
  return `<div class="grid">${s.accounts.map(card).join("")}</div>`;
}

async function renderAccount(id, assist) {
  const d = await api("/accounts/" + encodeURIComponent(id));
  const a = d.account;
  const callout = assist && a.auth.status !== "healthy" ? `<div class="callout"><b>Sign in to ${esc(a.name)}</b>
    <p>Choosing <b>Sign in now</b> opens a browser window on this computer with your username and password filled in.
    Finish whatever the site asks (verification code, CAPTCHA) and tick “remember me” if it's offered. Any waiting ${esc(a.kind)}s are downloaded right after.</p></div>` : "";
  const docs = d.documents.length ? `<table><tr><th>Date</th><th>Amount</th><th>Statement #</th><th>Actions</th><th>File</th></tr>
    ${d.documents.map(x => `<tr><td>${day(x.date)}${x.imported ? ' <span class="muted">(imported)</span>' : ""}${x.review === "pending" ? ' <span class="pill">review</span>' : ""}</td>
      <td>${money(x.amount)}</td><td>${esc(x.statementNumber || "–")}</td>
      <td>${(x.actions || []).map(r => `<div class="${r.succeeded ? "s-healthy" : "s-broken"}">${esc(r.type)}: ${esc(r.summary)}</div>`).join("") || '<span class="muted">–</span>'}</td>
      <td><code>${esc(x.path.split(/[\\/]/).pop())}</code></td></tr>`).join("")}</table>`
    : `<div class="empty">No ${esc(a.kind)}s on record. <button onclick="importHistory('${a.id}')">Import from folder</button></div>`;
  const signIns = d.signIns.length ? `<table><tr><th>When</th><th>Result</th><th>Helped</th><th>Remembered until</th><th>Machine</th></tr>
    ${d.signIns.map(e => `<tr><td>${when(e.atUtc)}</td><td class="${e.succeeded ? "s-healthy" : "s-broken"}">${e.succeeded ? "Signed in" : esc(e.reason)}${e.detail ? ` <span class="muted">${esc(e.detail)}</span>` : ""}</td>
      <td>${e.assisted ? "yes" : ""}</td><td>${when(e.rememberedUntilUtc)}</td><td>${esc(e.machine)}</td></tr>`).join("")}</table>`
    : `<div class="empty">No sign-ins yet.</div>`;
  const e = a.estimate;
  return `${callout}${card(a)}
    <h3>Cycle</h3>
    <div class="card">${e ? `
      <div class="row"><span>Typical interval</span><span>${e.intervalDays} days ± ${e.spreadDays}</span></div>
      <div class="row"><span>Posting delay</span><span>${e.postingDelayDays} day(s) after the document date</span></div>
      <div class="row"><span>Next expected</span><span>${day(e.nextExpected)}</span></div>
      <div class="row"><span>Window</span><span>${day(e.windowStart)} – ${day(e.windowEnd)}</span></div>`
      : `<span class="muted">Needs 3 documents to learn the cycle. Schedule: ${esc(a.schedule)}.</span>`}
      <div class="row"><span>Folder</span><span><code>${esc(a.folder)}</code></span></div></div>
    <h3>${esc(a.kind[0].toUpperCase() + a.kind.slice(1))}s</h3>${docs}
    <h3>Sign-in history</h3>${signIns}`;
}

async function renderReview() {
  const items = await api("/review");
  if (!items.length) return `<div class="empty">Nothing waiting for review.</div>`;
  return `<table><tr><th>Account</th><th>Date</th><th>Amount</th><th>Statement #</th><th>Will run</th><th></th></tr>
    ${items.map(x => `<tr><td>${esc(x.account)}</td><td>${day(x.date)}</td><td>${money(x.amount)}</td><td>${esc(x.statementNumber || "–")}</td>
      <td>${esc((x.actions || []).join(", "))}</td>
      <td><button class="primary" onclick="review('${x.id}','approve')">Approve</button> <button onclick="review('${x.id}','reject')">Reject</button></td></tr>`).join("")}</table>`;
}

async function renderIssues() {
  const d = await api("/issues");
  const open = d.open.length ? d.open.map(issueHtml).join("") : `<div class="empty">Nothing needs you right now.</div>`;
  const recent = d.recent.length ? `<table><tr><th>When</th><th>Level</th><th>Notification</th><th>Sent to</th></tr>
    ${d.recent.map(n => `<tr><td>${when(n.atUtc)}</td><td>${esc(n.notification.level)}</td><td><b>${esc(n.notification.title)}</b><br><span class="muted">${esc(n.notification.message)}</span></td>
      <td>${esc((n.channels || []).join(", ") || "log only")}${n.error ? `<div class="s-broken">${esc(n.error)}</div>` : ""}</td></tr>`).join("")}</table>`
    : `<div class="empty">No notifications yet.</div>`;
  const held = d.held.length ? `<p class="muted">${d.held.length} notification(s) held for quiet hours or the daily summary.</p>` : "";
  return `<h3 style="margin-top:0">Open</h3>${open}<h3>Recent notifications</h3>
    <div class="actions" style="margin:0 0 12px"><button onclick="testNotify()">Send test notification</button></div>${held}${recent}`;
}

const TOKENS_HELP = `Tokens: <code>{year}</code> <code>{month}</code> <code>{date:yyyy-MM-dd}</code> <code>{statement}</code> (statement or invoice number) <code>{account}</code> <code>{kind}</code>. Use <code>/</code> between folder levels.`;
let settingsData = null, editingId = null, editingRoot = false, settingsFilter = "";

async function renderSettings() {
  settingsData = await api("/settings");
  editingId = null; editingRoot = false;
  const d = settingsData;
  return `<div class="card" id="rootCard">${rootHtml()}</div>
    <div class="toolbar">
      <input type="search" id="acctFilter" placeholder="Filter by account, site or folder" value="${esc(settingsFilter)}" aria-label="Filter accounts">
      <span class="muted" id="acctCount"></span>
    </div>
    <div class="list" id="acctList">${d.accounts.length ? d.accounts.map(a => `<div class="lrow" data-account="${esc(a.id)}">${rowHtml(a)}</div>`).join("") : `<div class="empty">No accounts configured.</div>`}</div>
    <datalist id="folderSuggest"></datalist>
    <p class="hint">${TOKENS_HELP} Changes only affect new documents; files already saved stay where they are.</p>
    <p class="hint">Saved to <code>${esc(d.configFile)}</code>. Comments are kept, the previous version is kept as <code>config.yaml.bak</code>, and changes take effect immediately.</p>`;
}

function rootHtml() {
  const d = settingsData;
  if (!editingRoot) return `<div class="lrow" style="padding:0">
      <div class="lmain"><b>Base folder</b> <span class="muted">— every account's folder is inside this one</span>
        <div class="path" style="font-size:14px;color:var(--text)">${esc(d.documentsRoot)}</div>
        ${d.documentsRootExists ? "" : `<div class="hint s-broken">This folder doesn't exist on this computer.</div>`}</div>
      <button onclick="editRoot()">Change</button></div>`;
  return `<b>Base folder</b>
    <div class="muted">It can differ on each computer — for example your Google Drive folder on Windows and on a Mac.</div>
    <label for="root">Base folder on this computer</label>
    <input type="text" id="root" value="${esc(d.documentsRoot)}" data-original="${esc(d.documentsRoot)}" spellcheck="false">
    <div class="rowbtns"><button class="primary" onclick="saveRoot()">Save</button><button onclick="cancelEdit()">Cancel</button><span class="msg"></span></div>`;
}

function rowHtml(a) {
  return `<div class="lmain"><b>${esc(a.name)}</b> <span class="muted">${esc(a.site)}</span>
      <div class="path" title="${esc(a.example)}">${esc(a.relative)}</div></div>
    <button onclick="editAccount('${esc(a.id)}')">Edit</button>`;
}

function editorHtml(a) {
  return `<b>${esc(a.name)}</b> <span class="muted">${esc(a.site)}</span>
    <div class="fields">
      <div><label for="f-folder">Folder <span class="muted" style="font-weight:400">— inside the base folder</span></label>
        <input type="text" id="f-folder" data-field="folder" list="folderSuggest" value="${esc(a.folder)}" data-original="${esc(a.folder)}" spellcheck="false" autocomplete="off"></div>
      <div><label for="f-file">File name</label>
        <input type="text" id="f-file" data-field="fileName" value="${esc(a.fileName)}" data-original="${esc(a.fileName)}" spellcheck="false"></div>
    </div>
    <div class="preview" data-preview title="${esc(a.example)}">${esc(a.relative)}</div>
    <div class="rowbtns"><button class="primary" onclick="saveAccount()">Save</button><button onclick="cancelEdit()">Cancel</button>
      <span class="muted">Example: where the latest document on record would be saved.</span><span class="msg"></span></div>`;
}

function settingsDirty() {
  return [...document.querySelectorAll("main input[data-original]")].some(i => i.value !== i.dataset.original);
}

function confirmDiscard() { return !settingsDirty() || confirm("Discard your unsaved changes?"); }

function closeEditors() {
  if (editingId) {
    const row = document.querySelector(`[data-account="${CSS.escape(editingId)}"]`);
    const a = settingsData.accounts.find(x => x.id === editingId);
    if (row && a) { row.classList.remove("editing"); row.innerHTML = rowHtml(a); }
  }
  if (editingRoot) { editingRoot = false; $("#rootCard").innerHTML = rootHtml(); }
  editingId = null;
}

function editAccount(id) {
  if (!confirmDiscard()) return;
  closeEditors();
  editingId = id;
  const row = document.querySelector(`[data-account="${CSS.escape(id)}"]`);
  row.classList.add("editing");
  row.innerHTML = editorHtml(settingsData.accounts.find(x => x.id === id));
  const input = row.querySelector("#f-folder");
  input.focus(); input.setSelectionRange(input.value.length, input.value.length);
  suggestFolders(input.value);
}

function editRoot() {
  if (!confirmDiscard()) return;
  closeEditors();
  editingRoot = true;
  $("#rootCard").innerHTML = rootHtml();
  $("#root").focus();
}

function cancelEdit() { if (confirmDiscard()) closeEditors(); }

function setMsg(container, html) { const m = container.querySelector(".msg"); if (m) m.innerHTML = html; }

async function postSettings(body) {
  try {
    settingsData = await api("/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return null;
  } catch (e) { try { return JSON.parse(e.message).error || e.message; } catch { return e.message; } }
}

async function saveAccount() {
  const row = document.querySelector(".lrow.editing");
  const id = editingId;
  const error = await postSettings({ accounts: [{ id, folder: $("#f-folder").value, fileName: $("#f-file").value }] });
  if (error) return setMsg(row, `<span class="s-broken">${esc(error)}</span>`);
  editingId = null;
  row.classList.remove("editing");
  row.innerHTML = rowHtml(settingsData.accounts.find(x => x.id === id));
  row.classList.remove("saved"); void row.offsetWidth; row.classList.add("saved");
}

async function saveRoot() {
  const error = await postSettings({ documentsRoot: $("#root").value });
  if (error) return setMsg($("#rootCard"), `<span class="s-broken">${esc(error)}</span>`);
  editingRoot = false;
  $("#rootCard").innerHTML = rootHtml();
  for (const a of settingsData.accounts) {
    const row = document.querySelector(`[data-account="${CSS.escape(a.id)}"]`);
    if (row && !row.classList.contains("editing")) row.innerHTML = rowHtml(a);
  }
}

function applyFilter() {
  const rows = [...document.querySelectorAll("[data-account]")];
  const q = settingsFilter.trim().toLowerCase();
  let shown = 0;
  for (const row of rows) {
    const a = settingsData.accounts.find(x => x.id === row.dataset.account);
    const hit = !q || row.classList.contains("editing") || [a.name, a.id, a.site, a.folder, a.fileName, a.relative].some(v => String(v).toLowerCase().includes(q));
    row.style.display = hit ? "" : "none";
    if (hit) shown++;
  }
  const c = $("#acctCount");
  if (c) c.textContent = q ? `${shown} of ${rows.length} accounts` : `${rows.length} account${rows.length === 1 ? "" : "s"}`;
}

let previewTimer, folderTimer, folderParent = null;
function onSettingsInput(e) {
  if (e.target.id === "acctFilter") { settingsFilter = e.target.value; return applyFilter(); }
  if (!editingId) return;
  if (e.target.id === "f-folder") suggestFolders(e.target.value);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const box = document.querySelector(".lrow.editing [data-preview]");
    if (!box) return;
    const q = new URLSearchParams({ account: editingId, folder: $("#f-folder").value, fileName: $("#f-file").value });
    try {
      const r = await api("/settings/preview?" + q);
      box.classList.toggle("bad", !!r.problem);
      box.textContent = r.problem || r.relative;
      box.title = r.path || "";
    } catch (err) { box.classList.add("bad"); box.textContent = err.message; }
  }, 200);
}

// Suggest existing subfolders of whatever folder has been typed so far.
function suggestFolders(value) {
  const parent = value.includes("/") ? value.slice(0, value.lastIndexOf("/")) : "";
  if (parent === folderParent || /[{}]/.test(parent)) return;
  folderParent = parent;
  clearTimeout(folderTimer);
  folderTimer = setTimeout(async () => {
    try {
      const r = await api("/settings/folders?" + new URLSearchParams({ under: parent }));
      const list = $("#folderSuggest");
      if (list) list.innerHTML = r.folders.flatMap(f => [f, f + "/{year}"]).map(f => `<option value="${esc(f)}">`).join("");
    } catch { }
  }, 150);
}

document.addEventListener("input", e => { if (e.target.closest("main") && location.pathname === "/settings") onSettingsInput(e); });
document.addEventListener("keydown", e => {
  if (location.pathname !== "/settings") return;
  if (e.key === "Escape" && (editingId || editingRoot)) cancelEdit();
  if (e.key === "Enter" && e.target.matches(".lrow.editing input")) saveAccount();
  if (e.key === "Enter" && e.target.id === "root") saveRoot();
});
window.addEventListener("beforeunload", e => { if (location.pathname === "/settings" && settingsDirty()) e.preventDefault(); });

async function refreshBadges() {
  try {
    const [issues, review] = await Promise.all([api("/issues"), api("/review")]);
    const n = issues.open.filter(i => i.level === "action-needed").length;
    $("#issueBadge").innerHTML = n ? `<span class="badge">${n}</span>` : "";
    $("#reviewBadge").innerHTML = review.length ? `<span class="badge">${review.length}</span>` : "";
  } catch { }
}

let timer;
async function render() {
  clearTimeout(timer);
  const p = location.pathname;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === p || (p.startsWith("/accounts") && a.getAttribute("href") === "/")));
  try {
    const html = p.startsWith("/accounts/") ? await renderAccount(decodeURIComponent(p.split("/")[2]), new URLSearchParams(location.search).has("assist"))
      : p === "/review" ? await renderReview() : p === "/issues" ? await renderIssues() : p === "/settings" ? await renderSettings() : await renderDashboard();
    $("#main").innerHTML = html;
    if (p === "/settings") { folderParent = null; applyFilter(); }
  } catch (e) { $("#main").innerHTML = `<div class="issue"><b>Couldn't load</b>${esc(e.message)}</div>`; }
  refreshBadges();
  // The settings page isn't refreshed on a timer, so it never wipes what you're typing.
  if (p !== "/settings") timer = setTimeout(render, document.querySelector("[disabled]") ? 3000 : 30000);
}

async function run(id, kind) {
  try { await post(`/accounts/${encodeURIComponent(id)}/${kind}`); } catch (e) { alert(e.message); }
  setTimeout(render, 400);
}
async function review(id, decision) { try { await post(`/review/${id}/${decision}`); } catch (e) { alert(e.message); } render(); }
async function testNotify() {
  const r = await post("/notifications/test");
  alert(r.length ? r.map(x => `${x.channel}: ${x.ok ? "sent" : x.error}`).join("\n") : "No notification channels are configured.");
}
async function dismiss(key) { await post(`/issues/${encodeURIComponent(key)}/dismiss`); render(); }
async function importHistory(id) { const r = await post(`/accounts/${encodeURIComponent(id)}/import-history`); alert(`Imported ${r.added} document(s).`); render(); }

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-nav]");
  if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  if (location.pathname === "/settings" && settingsDirty() && !confirm("Leave without saving your changes?")) return;
  history.pushState(null, "", a.getAttribute("href"));
  render();
});
window.addEventListener("popstate", render);
render();
</script>
</body>
</html>
